<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{TITULO}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* A5, una sección = una página. Tokens: marfil, salvia, verde profundo, dorado. */
:root{
  --marfil:#FAF7F0; --salvia:#5E7A63; --salvia-claro:#E6ECE3; --tinta:#24352B; --dorado:#A9853A; --linea:#D9D2C2;
  --f-titulo:"Cormorant Garamond", Georgia, serif;
  --f-texto:"Source Serif 4", Georgia, serif;
  --f-rotulo:"Inter", Arial, sans-serif;
}
@page{size:148mm 210mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--marfil);color:var(--tinta);font-family:var(--f-texto);font-size:9.6pt;line-height:1.5}
body{counter-reset:pag}
.pag{position:relative;width:148mm;height:210mm;overflow:hidden;padding:16mm 15mm 18mm;page-break-after:always;counter-increment:pag;display:flex;flex-direction:column}
footer{position:absolute;left:15mm;right:15mm;bottom:8mm;display:flex;justify-content:space-between;font-family:var(--f-rotulo);font-size:6.5pt;letter-spacing:.14em;text-transform:uppercase;color:var(--salvia)}
.folio::after{content:counter(pag)}
h1,h2{font-family:var(--f-titulo);font-weight:600;margin:0;line-height:1.05;text-wrap:balance}
h2{font-size:24pt;margin-bottom:5mm}
p{margin:0 0 3mm}
.eyebrow{font-family:var(--f-rotulo);font-size:7pt;letter-spacing:.2em;text-transform:uppercase;color:var(--dorado);margin-bottom:3mm}
.eyebrow.claro{color:#F1DFB1}
.caja{margin-top:auto;background:var(--salvia-claro);border-radius:2mm;padding:4mm 5mm;font-size:9pt}

/* Portada */
.portada{padding:0;color:#fff}
.portada-foto,.foto-plena{position:absolute;inset:0;background-size:cover;background-position:center}
.sin-foto{background:linear-gradient(160deg,#C9B88E 0%,#7F977F 55%,#33493A 100%)}
.portada-velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,40,31,.72) 0%,rgba(26,40,31,.25) 45%,rgba(26,40,31,.75) 100%)}
.portada-texto{position:relative;height:100%;display:flex;flex-direction:column;padding:18mm 14mm 12mm;text-align:center;align-items:center}
.sello{font-family:var(--f-rotulo);font-size:7pt;letter-spacing:.24em;text-transform:uppercase;border:1px solid rgba(255,255,255,.7);padding:1.5mm 4mm;border-radius:10mm}
.portada h1{font-size:46pt;margin-top:8mm}
.portada .sub{font-family:var(--f-titulo);font-style:italic;font-size:14pt;margin-top:3mm;max-width:100mm}
.badges{list-style:none;padding:0;margin:auto 0 6mm;display:flex;gap:2mm;flex-wrap:wrap;justify-content:center}
.badges li{font-family:var(--f-rotulo);font-size:6.8pt;letter-spacing:.06em;background:rgba(250,247,240,.92);color:var(--tinta);padding:1.6mm 3mm;border-radius:10mm}
.marca{font-family:var(--f-rotulo);font-size:7.5pt;letter-spacing:.3em;text-transform:uppercase}

.centrada{justify-content:center;text-align:center}
.creditos h2{font-size:20pt}
.creditos .chico{font-size:7.4pt;color:#5a6a60;margin-top:6mm}
.texto p{font-size:10pt}
.firma{font-family:var(--f-titulo);font-style:italic;font-size:13pt;margin-top:4mm}
.pasos{padding-left:5mm;margin:0}
.pasos li{margin-bottom:3mm}

/* Aperturas con foto */
.apertura{padding:0;color:#fff}
.velo-abajo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,40,31,0) 35%,rgba(26,40,31,.85) 100%)}
.apertura-texto{position:relative;margin-top:auto;padding:0 15mm 16mm}
.apertura-texto h2{font-size:30pt;margin-bottom:3mm}
.marca-cierre{font-family:var(--f-rotulo);font-size:7.5pt;letter-spacing:.3em;text-transform:uppercase;margin-top:6mm}

/* Semanas */
.semana{background:var(--salvia);color:var(--marfil);justify-content:center;align-items:center;text-align:center}
.semana-num{font-family:var(--f-rotulo);font-size:8pt;letter-spacing:.3em;text-transform:uppercase;color:#F1DFB1}
.semana-titulo{font-size:38pt;margin:4mm 0}
.semana-rango{font-style:italic;max-width:90mm}

/* Días */
.dia-cabecera{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--linea);padding-bottom:2mm;margin-bottom:3mm}
.dia-num{font-family:var(--f-rotulo);font-size:7.5pt;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--dorado)}
.check{font-family:var(--f-rotulo);font-size:7pt;color:var(--salvia)}
.dia-titulo{font-size:22pt;margin-bottom:3mm}
.versiculo{margin:0 0 3.5mm;padding:3mm 4mm;border-left:2.5px solid var(--dorado);background:#F3EEE2}
.versiculo p{font-family:var(--f-titulo);font-style:italic;font-size:12pt;line-height:1.3;margin:0 0 1mm}
.versiculo cite{font-family:var(--f-rotulo);font-style:normal;font-size:7pt;letter-spacing:.08em;color:var(--salvia)}
.lectura p{margin-bottom:2.2mm}
.rotulo{display:block;font-family:var(--f-rotulo);font-size:6.8pt;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--salvia);margin-bottom:1mm}
.oracion{margin-top:1.5mm}
.oracion p{font-style:italic}
.diario{margin-top:auto}
.diario p{font-weight:600;margin-bottom:2mm}
.lineas{height:16mm;background:repeating-linear-gradient(180deg,transparent 0 7.6mm,var(--linea) 7.6mm 8mm)}

/* Tarjetas */
.tarjetas{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:0;height:100%;border:1px dashed #b9b09b}
.tarjeta{border:1px dashed #b9b09b;padding:6mm 5mm;display:flex;flex-direction:column;justify-content:center;text-align:center;background:linear-gradient(180deg,#FBF8F1,#F1ECDD)}
.tarjeta p{font-family:var(--f-titulo);font-style:italic;font-size:11pt;line-height:1.3;margin-bottom:3mm}
.tarjeta cite{font-family:var(--f-rotulo);font-style:normal;font-size:6.5pt;letter-spacing:.1em;color:var(--dorado);text-transform:uppercase}
.t-num{font-family:var(--f-rotulo);font-size:6pt;color:var(--salvia);margin-bottom:2mm}
.tarjetas-pag{padding:12mm 12mm 16mm}

/* Hijos */
.hijos-pag{gap:5mm}
.hijo{border-bottom:1px solid var(--linea);padding-bottom:4mm}
.hijo:last-of-type{border-bottom:0}
.notas{margin-top:auto}
.hijo-cab{font-family:var(--f-titulo);font-size:15pt;font-weight:600;margin-bottom:1.5mm}
.hijo-vers{font-style:italic;color:#3c5446}
.hijo-vers cite{font-style:normal;font-family:var(--f-rotulo);font-size:6.8pt;color:var(--dorado)}

/* Plan */
.plan{width:100%;border-collapse:collapse;font-size:8.2pt}
.plan th{font-family:var(--f-rotulo);font-size:6.5pt;letter-spacing:.14em;text-transform:uppercase;color:var(--salvia);text-align:left;border-bottom:1.5px solid var(--salvia);padding:1.5mm 1mm}
.plan td{border-bottom:1px solid var(--linea);padding:1.9mm 1mm;vertical-align:top}
.plan .sem,.plan .cap{font-family:var(--f-rotulo);font-size:7pt;color:var(--dorado);width:9mm;font-variant-numeric:tabular-nums}
.plan .box{width:6mm;color:var(--salvia)}
</style>
</head>
<body>
{{PAGINAS}}
</body>
</html>
